events {}
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /hemovida {
      return 301 /hemovida/;
    }
    location /hemovida/ {
      rewrite ^/hemovida/(.*)$ /$1 last;
    }
    location / {
      try_files $uri $uri.html $uri/ /index.html;
    }
  }
}
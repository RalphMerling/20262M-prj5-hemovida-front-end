server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redireciona sem mudar a porta que o navegador está usando
    absolute_redirect off;

    location = / {
        return 302 /hemovida/;
    }

    location = /hemovida {
        return 301 /hemovida/;
    }

    # O Next exporta cada página como arquivo .html (ex: /hemovida/admin/doacao.html)
    location /hemovida/ {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /hemovida/404.html;
}